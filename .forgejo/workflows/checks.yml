# Required checks for every repository of the project but the coordination one. The
# forge's directory is code-owned by the human, so agents can't change this file
# without them. No `uses:` actions: everything here is plain shell, so CI fetches no
# code from outside. FORGE_URL and the proxy settings come from the runner.
name: checks

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash   # bash with -eo pipefail

jobs:
  build:
    runs-on: docker
    container:
      image: inkproof-ci:1
      volumes:
        - inkproof-elan:/opt/elan/toolchains
        - inkproof-npm:/var/cache/npm
    env:
      ELAN_HOME: /opt/elan
      # npm's cache, kept between jobs in its own volume. npm ci checks every
      # package against package-lock.json's integrity hashes, and the cache is
      # content-addressed and written atomically, so jobs share it safely, at
      # once too. A cached package is taken without asking the registry
      # again; a stalled download fails after a minute and is retried, rather
      # than holding the job for npm's default of five minutes a try.
      npm_config_cache: /var/cache/npm
      npm_config_prefer_offline: "true"
      npm_config_fetch_timeout: "60000"
      npm_config_fetch_retries: "5"
      npm_config_update_notifier: "false"
      # ci-reader's token: reads every repository of this project, writes
      # nothing. The job's own token reads only this repository.
      TOKEN: ${{ secrets.DEPS_READ_TOKEN }}
      # Every GitHub owner this project's repositories have lived under,
      # current first, and the repositories; set by the kit's bootstrap.
      GH_OWNERS: ${{ vars.DEPS_GITHUB_OWNERS }}
      DEPS_REPOSITORIES: ${{ vars.DEPS_REPOSITORIES }}
    steps:
      - name: Check out
        run: |
          echo /opt/elan/bin >> "$GITHUB_PATH"
          auth="Authorization: Basic $(printf 'ci-reader:%s' "$TOKEN" | base64 | tr -d '\n')"
          git config --global "http.${FORGE_URL}/.extraHeader" "$auth"
          # Dependencies keep their GitHub URLs; fetch this project's from the forge.
          [ -n "$DEPS_REPOSITORIES" ] || { echo "::error::The DEPS_REPOSITORIES variable is not set; run the kit's bootstrap"; exit 1; }
          for owner in $GH_OWNERS; do
            for repo in $DEPS_REPOSITORIES; do
              git config --global --add "url.${FORGE_URL}/${GITHUB_REPOSITORY_OWNER}/${repo}.insteadOf" \
                "https://github.com/${owner}/${repo}"
            done
          done
          git init -q .
          git remote add origin "${FORGE_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --tags origin "+${GITHUB_REF}:refs/ci/head" '+refs/heads/main:refs/remotes/origin/main'
          git checkout -q --detach "$GITHUB_SHA"
          git log -1 --format='Checked out %H: %s'

      - name: Internal dependencies pinned to release tags
        run: bash scripts/check-pins.sh

      - name: Build, failing on sorry
        run: |
          lake build 2>&1 | tee build.log
          if grep -qE 'declaration uses .sorry.' build.log; then
            echo "::error::A declaration uses sorry"
            exit 1
          fi

      # Lasm and browser tests run where an npm project pins them: the test
      # subproject (test/package-lock.json) or an application's app/
      # (app/package-lock.json). Its packages may come from Lake's (file:
      # paths into .lake/packages), so this runs after the build.
      - name: Install Lasm
        run: |
          found=
          for d in test app; do
            if [ -f "$d/package-lock.json" ]; then
              (cd "$d" && npm ci --no-fund --no-audit)
              found=1
            fi
          done
          [ -n "$found" ] || echo "No test/ or app/ package-lock.json; Lasm tests are skipped."

      - name: Tests
        run: |
          # Fail, rather than skip with a warning, if Lasm is pinned but missing.
          if [ -f test/package-lock.json ] || [ -f app/package-lock.json ]; then export INKPROOF_REQUIRE_LASM=1; fi
          lake test

      # A site's release tags are deployed to GitHub Pages by
      # .github/workflows/pages.yml, which runs scripts/build-site.sh: build
      # it here first, so a broken site never reaches a tag.
      - name: Site builds
        run: |
          if [ -f scripts/build-site.sh ]; then
            bash scripts/build-site.sh
            if [ ! -f _site/index.html ]; then
              echo "::error::scripts/build-site.sh left no _site/index.html"
              exit 1
            fi
          else
            echo "No scripts/build-site.sh; not a site."
          fi

      - name: API lock is up to date
        run: |
          if [ -f scripts/api-lock.sh ]; then
            bash scripts/api-lock.sh > API.lock.generated
            diff -u API.lock API.lock.generated
          else
            echo "::warning::scripts/api-lock.sh not implemented yet; skipping"
          fi
