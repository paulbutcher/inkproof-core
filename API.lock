constructor Inkproof.Core.SegmentError.unsortedBreaks : Nat → Inkproof.Core.SegmentError
structure Inkproof.Core.Segmented : (α : Type u) → Type v → [LE α] → Type (max u v)
field Inkproof.Core.Segmented.breaks : {α : Type u} → {β : Type v} → [inst : LE α] → Inkproof.Core.Segmented α β → Array Nat
theorem Inkproof.Core.Segmented.breaks_bounded : ∀ {α : Type u} {β : Type v} [inst : LE α] (self : Inkproof.Core.Segmented α β) (i : Nat) (h : i < self.breaks.size), 0 < self.breaks[i] ∧ self.breaks[i] < self.series.size
theorem Inkproof.Core.Segmented.breaks_increasing : ∀ {α : Type u} {β : Type v} [inst : LE α] (self : Inkproof.Core.Segmented α β) (i : Nat) (h : i + 1 < self.breaks.size), self.breaks[i] < self.breaks[i + 1]
theorem Inkproof.Core.Segmented.flatten_segments : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β), (List.map (fun x => x.points.toList) g.segments.toList).flatten = g.series.points.toList
theorem Inkproof.Core.Segmented.mem_breaks_splitWhere : ∀ {α : Type u} {β : Type v} [inst : LE α] (s : Inkproof.Core.Series α β) (gap : α → α → Bool) (b : Nat), b ∈ (Inkproof.Core.Segmented.splitWhere s gap).breaks ↔ ∃ h, gap s.xs[b - 1] s.xs[b] = Bool.true
constructor Inkproof.Core.Segmented.mk : {α : Type u} → {β : Type v} → [inst : LE α] → (series : Inkproof.Core.Series α β) → (breaks : Array Nat) → (∀ (i : Nat) (h : i + 1 < breaks.size), breaks[i] < breaks[i + 1]) → (∀ (i : Nat) (h : i < breaks.size), 0 < breaks[i] ∧ breaks[i] < series.size) → Inkproof.Core.Segmented α β
def Inkproof.Core.Segmented.numSegments : {α : Type u} → {β : Type v} → [inst : LE α] → Inkproof.Core.Segmented α β → Nat
def Inkproof.Core.Segmented.ofBreaks? : {α : Type u} → {β : Type v} → [inst : LE α] → Inkproof.Core.Series α β → Array Nat → Except Inkproof.Core.SegmentError (Inkproof.Core.Segmented α β)
theorem Inkproof.Core.Segmented.ofBreaks?_eq_ok : ∀ {α : Type u} {β : Type v} [inst : LE α] {s : Inkproof.Core.Series α β} {bs : Array Nat} {g : Inkproof.Core.Segmented α β}, Inkproof.Core.Segmented.ofBreaks? s bs = Except.ok g → g.series = s ∧ g.breaks = bs
theorem Inkproof.Core.Segmented.ofBreaks?_ok_iff : ∀ {α : Type u} {β : Type v} [inst : LE α] {s : Inkproof.Core.Series α β} {bs : Array Nat}, (∃ g, Inkproof.Core.Segmented.ofBreaks? s bs = Except.ok g) ↔ (∀ (i : Nat) (h : i + 1 < bs.size), bs[i] < bs[i + 1]) ∧ ∀ (i : Nat) (h : i < bs.size), 0 < bs[i] ∧ bs[i] < s.size
