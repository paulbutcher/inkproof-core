def Inkproof.Core.Pyramid.queryFrom : {M : Type u} → [Inkproof.Core.Aggregate M] → Array (Array M) → Nat → Nat → Nat → Nat → M
theorem Inkproof.Core.Pyramid.queryFrom_eq : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] [Inkproof.Core.LawfulAggregate M] (p : Inkproof.Core.Pyramid M) (k lo hi : Nat), k < p.levels.size → Inkproof.Core.Pyramid.queryFrom p.levels p.branching k lo hi = Inkproof.Core.Aggregate.foldRange (Inkproof.Core.Pyramid.levelAt p.branching p.leaves k) lo hi
