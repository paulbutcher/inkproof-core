theorem Inkproof.Core.Series.ofUnsorted_perm : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsLinearOrder α] {ps : Array (α × Option β)}, (Inkproof.Core.Series.ofUnsorted ps).points.toList.Perm ps.toList
theorem Inkproof.Core.Series.ofUnsorted_stable : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsLinearOrder α] {ps : Array (α × Option β)} {p q : α × Option β}, p.fst ≤ q.fst → [p, q].Sublist ps.toList → [p, q].Sublist (Inkproof.Core.Series.ofUnsorted ps).points.toList
def Inkproof.Core.Series.points : {α : Type u} → {β : Type v} → [inst : LE α] → Inkproof.Core.Series α β → Array (α × Option β)
theorem Inkproof.Core.Series.points_ofUnsorted : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsLinearOrder α] {ps : Array (α × Option β)}, (Inkproof.Core.Series.ofUnsorted ps).points.toList = ps.toList.mergeSort fun p q => Decidable.decide (p.fst ≤ q.fst)
theorem Inkproof.Core.Series.points_slice : ∀ {α : Type u} {β : Type v} [inst : LE α] (s : Inkproof.Core.Series α β) (lo hi : Nat), (s.slice lo hi).points = s.points.extract lo hi
