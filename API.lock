theorem Inkproof.Core.Pyramid.query_lowerBound : ∀ {α : Type u} {β : Type v} {M : Type w} [inst : LE α] [inst_1 : DecidableLE α] [Std.IsPreorder α] [inst_3 : Inkproof.Core.Aggregate M] [Inkproof.Core.LawfulAggregate M] (s : Inkproof.Core.Series α β) (b : Nat) (h : 2 ≤ b) (m : α × Option β → M) (x₀ x₁ : α), (Inkproof.Core.Pyramid.ofMeasure b h m s.points).query (s.lowerBound x₀) (s.lowerBound x₁) = Inkproof.Core.Aggregate.fold m (Array.filter (Inkproof.Core.Series.inRange x₀ x₁) s.points)
