theorem Inkproof.Core.Segmented.segmentStart_le_segmentStop : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β) (k : Nat), g.segmentStart k ≤ g.segmentStop k
theorem Inkproof.Core.Segmented.segmentStart_lt_segmentStop : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β) {k : Nat}, k < g.numSegments → g.segmentStart k < g.segmentStop k
theorem Inkproof.Core.Segmented.segmentStart_succ : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β) (k : Nat), g.segmentStart (k + 1) = g.segmentStop k
theorem Inkproof.Core.Segmented.segmentStart_zero : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β), g.segmentStart 0 = 0
def Inkproof.Core.Segmented.segmentStop : {α : Type u} → {β : Type v} → [inst : LE α] → Inkproof.Core.Segmented α β → Nat → Nat
theorem Inkproof.Core.Segmented.segmentStop_le_size : ∀ {α : Type u} {β : Type v} [inst : LE α] (g : Inkproof.Core.Segmented α β) (k : Nat), g.segmentStop k ≤ g.series.size
