constructor Inkproof.Core.Pyramid.mk : {M : Type u} → [inst : Inkproof.Core.Aggregate M] → (branching : Nat) → 2 ≤ branching → (leaves : Array M) → (levels : Array (Array M)) → (∀ (k : Nat) (h : k < levels.size), levels[k] = Inkproof.Core.Pyramid.levelAt branching leaves k) → Inkproof.Core.Pyramid M
