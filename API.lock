theorem Inkproof.Core.Pyramid.levels_eq : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] (self : Inkproof.Core.Pyramid M) (k : Nat) (h : k < self.levels.size), self.levels[k] = Inkproof.Core.Pyramid.levelAt self.branching self.leaves k
