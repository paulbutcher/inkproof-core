constructor Inkproof.Core.Series.mk : {α : Type u} → {β : Type v} → [inst : LE α] → (xs : Array α) → (values : Array (Option β)) → values.size = xs.size → Inkproof.Core.Sorted xs → Inkproof.Core.Series α β
def Inkproof.Core.Series.ofArrays? : {α : Type u} → {β : Type v} → [inst : LE α] → [DecidableLE α] → [Std.IsPreorder α] → Array α → Array (Option β) → Except Inkproof.Core.SeriesError (Inkproof.Core.Series α β)
theorem Inkproof.Core.Series.ofArrays?_eq_error_sizeMismatch : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {xs : Array α} {vs : Array (Option β)} {a b : Nat}, Inkproof.Core.Series.ofArrays? xs vs = Except.error (Inkproof.Core.SeriesError.sizeMismatch a b) → a = xs.size ∧ b = vs.size ∧ vs.size ≠ xs.size
theorem Inkproof.Core.Series.ofArrays?_eq_error_unsorted : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {xs : Array α} {vs : Array (Option β)} {i : Nat}, Inkproof.Core.Series.ofArrays? xs vs = Except.error (Inkproof.Core.SeriesError.unsorted i) → ∃ hi, ¬xs[i] ≤ xs[i + 1] ∧ ∀ (j : Nat) (hj : j < i), xs[j] ≤ xs[j + 1]
theorem Inkproof.Core.Series.ofArrays?_eq_ok : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {xs : Array α} {vs : Array (Option β)} {s : Inkproof.Core.Series α β}, Inkproof.Core.Series.ofArrays? xs vs = Except.ok s → s.xs = xs ∧ s.values = vs
theorem Inkproof.Core.Series.ofArrays?_ok_iff : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {xs : Array α} {vs : Array (Option β)}, (∃ s, Inkproof.Core.Series.ofArrays? xs vs = Except.ok s) ↔ vs.size = xs.size ∧ Inkproof.Core.Sorted xs
def Inkproof.Core.Series.ofPoints? : {α : Type u} → {β : Type v} → [inst : LE α] → [DecidableLE α] → [Std.IsPreorder α] → Array (α × Option β) → Except Inkproof.Core.SeriesError (Inkproof.Core.Series α β)
theorem Inkproof.Core.Series.ofPoints?_eq_ok : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {ps : Array (α × Option β)} {s : Inkproof.Core.Series α β}, Inkproof.Core.Series.ofPoints? ps = Except.ok s → s.points = ps
theorem Inkproof.Core.Series.ofPoints?_ok_iff : ∀ {α : Type u} {β : Type v} [inst : LE α] [inst_1 : DecidableLE α] [inst_2 : Std.IsPreorder α] {ps : Array (α × Option β)}, (∃ s, Inkproof.Core.Series.ofPoints? ps = Except.ok s) ↔ Inkproof.Core.Sorted (Array.map (fun x => x.fst) ps)
