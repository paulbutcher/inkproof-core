theorem Inkproof.Core.Pyramid.div_lt_size_levelAt : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] {b : Nat}, 0 < b → ∀ (a : Array M) {i : Nat}, i < a.size → ∀ (k : Nat), i / b ^ k < (Inkproof.Core.Pyramid.levelAt b a k).size
theorem Inkproof.Core.Pyramid.div_lt_size_levels : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] (p : Inkproof.Core.Pyramid M) {i : Nat}, i < p.leaves.size → ∀ {k : Nat} (hk : k < p.levels.size), i / p.branching ^ k < p.levels[k].size
theorem Inkproof.Core.Pyramid.foldRange_coarsen : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] [Inkproof.Core.LawfulAggregate M] {b : Nat}, 0 < b → ∀ (a : Array M) (c d : Nat), Inkproof.Core.Aggregate.foldRange (Inkproof.Core.Pyramid.coarsen b a) c d = Inkproof.Core.Aggregate.foldRange a (c * b) (d * b)
theorem Inkproof.Core.Pyramid.foldRange_levelAt : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] [Inkproof.Core.LawfulAggregate M] {b : Nat}, 0 < b → ∀ (a : Array M) (k c d : Nat), Inkproof.Core.Aggregate.foldRange (Inkproof.Core.Pyramid.levelAt b a k) c d = Inkproof.Core.Aggregate.foldRange a (c * b ^ k) (d * b ^ k)
theorem Inkproof.Core.Pyramid.getElem_levels : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] [Inkproof.Core.LawfulAggregate M] (p : Inkproof.Core.Pyramid M) {k j : Nat} (hk : k < p.levels.size) (hj : j < p.levels[k].size), p.levels[k][j] = Inkproof.Core.Aggregate.foldRange p.leaves (j * p.branching ^ k) ((j + 1) * p.branching ^ k)
