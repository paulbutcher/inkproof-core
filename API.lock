theorem Inkproof.Core.Pyramid.buildLevels_getElem?_shape : ∀ {M : Type u} [inst : Inkproof.Core.Aggregate M] (b : Nat) (hb : 2 ≤ b) (n : Nat) (a : Array M), a.size ≤ n → ∀ (k : Nat) (x : Array M), (Inkproof.Core.Pyramid.buildLevels b hb a)[k]? = Option.some x → if (Inkproof.Core.Pyramid.buildLevels b hb a)[k + 1]?.isSome = Bool.true then 2 ≤ x.size else x.size ≤ 1
